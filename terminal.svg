<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 720" width="680" height="720">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .titlebar { fill: #313244; }
      .text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #cdd6f4; }
      .prompt { fill: #a6e3a1; font-weight: bold; }
      .cmd { fill: #89b4fa; }
      .key { fill: #cba6f7; }
      .val { fill: #cdd6f4; }
      .dir { fill: #89dceb; }
      .dim { fill: #6c7086; }
      .cursor { fill: #cdd6f4; }
      .dot-red { fill: #f38ba8; }
      .dot-yellow { fill: #f9e2af; }
      .dot-green { fill: #a6e3a1; }
    </style>
  </defs>

  <!-- Janela do terminal -->
  <rect width="680" height="720" rx="10" class="bg"/>

  <!-- Barra de título -->
  <rect width="680" height="38" rx="10" class="titlebar"/>
  <rect y="28" width="680" height="10" class="titlebar"/>

  <!-- Dots -->
  <circle cx="22" cy="19" r="6" class="dot-red"/>
  <circle cx="42" cy="19" r="6" class="dot-yellow"/>
  <circle cx="62" cy="19" r="6" class="dot-green"/>

  <!-- Título da janela -->
  <text x="340" y="24" text-anchor="middle" class="text dim">rug@semec: ~</text>

  <!-- Conteúdo -->
  <!-- whoami -->
  <text x="24" y="72" class="text"><tspan class="prompt">❯</tspan> <tspan class="cmd">whoami</tspan></text>

  <text x="24" y="94" class="text"><tspan class="key">  name      </tspan><tspan class="dim">→  </tspan><tspan class="val">Rafael Ruggieri</tspan></text>
  <text x="24" y="112" class="text"><tspan class="key">  role      </tspan><tspan class="dim">→  </tspan><tspan class="val">Dev Full Stack</tspan></text>
  <text x="24" y="130" class="text"><tspan class="key">  local     </tspan><tspan class="dim">→  </tspan><tspan class="val">Porto Velho, RO 🇧🇷</tspan></text>
  <text x="24" y="148" class="text"><tspan class="key">  empresa   </tspan><tspan class="dim">→  </tspan><tspan class="val">SEMEC · Inovação e Integração</tspan></text>

  <!-- stack -->
  <text x="24" y="180" class="text"><tspan class="prompt">❯</tspan> <tspan class="cmd">cat</tspan> <tspan class="dir">stack.json</tspan></text>

  <text x="24" y="202" class="text"><tspan class="key">  frontend  </tspan><tspan class="dim">→  </tspan><tspan class="val">Next.js · React · TypeScript · Tailwind</tspan></text>
  <text x="24" y="220" class="text"><tspan class="key">  backend   </tspan><tspan class="dim">→  </tspan><tspan class="val">Node.js · PostgreSQL · Qdrant</tspan></text>
  <text x="24" y="238" class="text"><tspan class="key">  ia/llms   </tspan><tspan class="dim">→  </tspan><tspan class="val">Claude API · Gemini API</tspan></text>
  <text x="24" y="256" class="text"><tspan class="key">  infra     </tspan><tspan class="dim">→  </tspan><tspan class="val">Vercel · Linux · GitHub</tspan></text>
  <text x="24" y="274" class="text"><tspan class="key">  agentes   </tspan><tspan class="dim">→  </tspan><tspan class="val">Cursor · Opencode</tspan></text>

  <!-- projetos -->
  <text x="24" y="306" class="text"><tspan class="prompt">❯</tspan> <tspan class="cmd">ls</tspan> <tspan class="dir">projetos/</tspan></text>

  <text x="24" y="328" class="text"><tspan class="dir">  📄 pdf-forms/       </tspan><tspan class="dim">formulários com geração automática de PDF</tspan></text>
  <text x="24" y="346" class="text"><tspan class="dim">                      Next.js · TypeScript · Tailwind</tspan></text>
  <text x="24" y="368" class="text"><tspan class="dir">  🤖 chatbot-ui/      </tspan><tspan class="dim">front-end de chatbot com integração LLM</tspan></text>
  <text x="24" y="386" class="text"><tspan class="dim">                      Next.js · Claude API · TypeScript</tspan></text>

  <!-- sobre -->
  <text x="24" y="544" class="text"><tspan class="prompt">❯</tspan> <tspan class="cmd">cat</tspan> <tspan class="dir">sobre.txt</tspan></text>

  <text x="24" y="566" class="text"><tspan class="key">  formação   </tspan><tspan class="dim">→  </tspan><tspan class="val">Sistemas de Informação · Unisapiens</tspan></text>
  <text x="24" y="584" class="text"><tspan class="key">  certs      </tspan><tspan class="dim">→  </tspan><tspan class="val">DIO · Fiber School · Fundação Bradesco</tspan></text>
  <text x="24" y="602" class="text"><tspan class="key">  background </tspan><tspan class="dim">→  </tspan><tspan class="val">helpdesk · redes · pós-venda telecom</tspan></text>

  <!-- contato -->
  <text x="24" y="634" class="text"><tspan class="prompt">❯</tspan> <tspan class="cmd">echo</tspan> <tspan class="val">$CONTATO</tspan></text>

  <text x="24" y="656" class="text"><tspan class="key">  github    </tspan><tspan class="dim">→  </tspan><tspan class="val">github.com/Rug-gieri</tspan></text>
  <text x="24" y="674" class="text"><tspan class="key">  linkedin  </tspan><tspan class="dim">→  </tspan><tspan class="val">linkedin.com/in/rug-gieri</tspan></text>

  <!-- cursor -->
  <text x="24" y="706" class="text"><tspan class="prompt">❯</tspan> <tspan class="cursor">▌</tspan></text>
</svg>
