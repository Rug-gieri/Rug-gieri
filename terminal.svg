<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" width="680" height="590">
  <defs>
    <style>
      .bg { fill: #05070d; }
      .titlebar { fill: #0b0f19; }
      .text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 13px;
        fill: #e5e7eb;
        font-variant-ligatures: none;
        letter-spacing: 0;
      }
      .prompt { fill: #22c55e; font-weight: bold; }
      .cmd { fill: #60a5fa; }
      .key { fill: #c084fc; }
      .val { fill: #e5e7eb; }
      .dir { fill: #67e8f9; }
      .dim { fill: #7c8596; }
      .cursor { fill: #f8fafc; }
      .dot-red { fill: #fb7185; }
      .dot-yellow { fill: #facc15; }
      .dot-green { fill: #4ade80; }
    </style>
  </defs>

  <rect width="680" height="590" rx="10" class="bg"/>

  <rect width="680" height="38" rx="10" class="titlebar"/>
  <rect y="28" width="680" height="10" class="titlebar"/>

  <circle cx="22" cy="19" r="6" class="dot-red"/>
  <circle cx="42" cy="19" r="6" class="dot-yellow"/>
  <circle cx="62" cy="19" r="6" class="dot-green"/>

  <text x="340" y="24" text-anchor="middle" class="text dim">rug@semec: ~</text>

