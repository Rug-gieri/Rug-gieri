  <text x="24" y="550" class="text"><tspan class="key">  linkedin  </tspan><tspan class="dim">→  </tspan><tspan class="val">linkedin.com/in/rug-gieri</tspan></text>

  <text x="24" y="578" class="text"><tspan class="prompt">❯</tspan> <tspan class="cursor">▌</tspan></text>
