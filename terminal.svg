<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 130" width="680" height="130">
  <defs>
    <style>
      .bg { fill: #121212; }
      .titlebar { fill: #2a2a2a; }
      .text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 13px;
        fill: #e0e0e0;
        font-variant-ligatures: none;
        letter-spacing: 0;
      }
      .prompt { fill: #a0a0a0; font-weight: bold; }
      .cmd { fill: #d0d0d0; }
      .key { fill: #b0b0b0; }
      .val { fill: #e0e0e0; }
      .dim { fill: #808080; }
    </style>
  </defs>

  <!-- Fundo da janela -->
  <rect width="680" height="130" rx="10" class="bg"/>

  <!-- Barra de título -->
  <rect width="680" height="38" rx="10" class="titlebar"/>
  <rect y="28" width="680" height="10" class="titlebar"/>

  <!-- Título à esquerda -->
  <text x="24" y="24" text-anchor="start" class="text dim">rug@semec: ~</text>

  <!-- Botões estilo 8‑bit agora com margem confortável à direita -->
  <!-- Minimizar -->
  <rect x="608" y="12" width="16" height="16" rx="0" fill="#555" stroke="#888" stroke-width="2"/>
  <rect x="612" y="20" width="8" height="2" fill="#aaa"/>

  <!-- Maximizar -->
  <rect x="628" y="12" width="16" height="16" rx="0" fill="#555" stroke="#888" stroke-width="2"/>
  <rect x="631" y="15" width="10" height="10" fill="none" stroke="#aaa" stroke-width="2"/>

  <!-- Fechar -->
  <rect x="648" y="12" width="16" height="16" rx="0" fill="#555" stroke="#888" stroke-width="2"/>
  <!-- X pixelado (centralizado verticalmente) -->
  <rect x="652" y="15" width="2" height="2" fill="#aaa"/>
  <rect x="660" y="15" width="2" height="2" fill="#aaa"/>
  <rect x="654" y="17" width="2" height="2" fill="#aaa"/>
  <rect x="658" y="17" width="2" height="2" fill="#aaa"/>
  <rect x="656" y="19" width="2" height="2" fill="#aaa"/>
  <rect x="656" y="21" width="2" height="2" fill="#aaa"/>
  <rect x="654" y="23" width="2" height="2" fill="#aaa"/>
  <rect x="658" y="23" width="2" height="2" fill="#aaa"/>
  <rect x="652" y="25" width="2" height="2" fill="#aaa"/>
  <rect x="660" y="25" width="2" height="2" fill="#aaa"/>

  <!-- Conteúdo do terminal -->
  <text x="24" y="72" class="text"><tspan class="prompt">❯</tspan> <tspan class="cmd">who am I</tspan></text>
  <text x="24" y="94" class="text"><tspan class="key">  name      </tspan><tspan class="dim">→  </tspan><tspan class="val">Rafael Ruggieri</tspan></text>
  <text x="24" y="112" class="text"><tspan class="key">  role      </tspan><tspan class="dim">→  </tspan><tspan class="val">Software Developer</tspan></text>
</svg>
